[project]
name = "open-sports-analyst"
version = "1.0.0"
description = "A local-first, evidence-bound sports analysis agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
authors = [{ name = "Aayush Chanda" }]
dependencies = [
    "altair>=5.5,<6", "azure-identity>=1.25,<2", "deepagents>=0.7,<0.8",
    "duckdb>=1.4,<2", "fastapi>=0.119,<1", "langchain-ollama>=1.0,<2",
    "langchain-openai>=1.0,<2", "nflreadpy>=0.1.5,<0.2", "numpy>=2.3,<3",
    "platformdirs>=4.4,<5", "polars>=1.34,<2", "pydantic>=2.11,<3",
    "pydantic-settings>=2.11,<3", "python-dotenv>=1.1,<2", "typer>=0.19,<1",
    "tzdata>=2025.2", "uvicorn[standard]>=0.37,<1", "vl-convert-python>=1.8,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "respx>=0.22,<1", "ruff>=0.14,<1"]

[project.scripts]
sports-analyst = "sports_analyst.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: downloads nflverse data", "live: requires a configured model provider"]

[tool.ruff]
target-version = "py313"
line-length = 143

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 140
