name: open-sports-analyst

x-app: &app
  image: open-sports-analyst:${SPORTS_ANALYST_IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  env_file:
    - .env.production
  init: true
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["sports-analyst", "serve", "--host", "0.0.0.0", "--port", "8080"]
    expose:
      - "8080"
    mem_limit: 2g
    volumes:
      - api-cache:/var/lib/open-sports-analyst
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *app
    command: ["sports-analyst-worker"]
    mem_limit: 8g
    stop_grace_period: 45s
    volumes:
      - worker-cache:/var/lib/open-sports-analyst

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - .env.production
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  api-cache:
  worker-cache:
