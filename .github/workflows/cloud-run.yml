name: Cloud Run deployment
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'frontend/**', 'migrations/**', 'Dockerfile', 'pyproject.toml', 'uv.lock', 'deploy/cloud-run/**', '.github/workflows/cloud-run.yml' ]
permissions:
  contents: read
  id-token: write
concurrency:
  group: open-sports-analyst-cloud-run-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: cloud-run
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: open-sports-analyst-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: bash deploy/cloud-run/deploy.sh
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
          MODEL: ${{ vars.MODEL }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
