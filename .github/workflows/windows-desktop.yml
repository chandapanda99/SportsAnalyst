name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate version and locked dependencies
        shell: powershell
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = & python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Could not read project version" }
          if ($env:BUILD_REF_TYPE -eq "tag") {
            $releaseVersion = $env:BUILD_REF_NAME.Substring(1)
            $valid = $releaseVersion -eq $version -or $releaseVersion -match ('^{0}-(?:alpha|beta|rc)(?:[.-]\d+)?$' -f [Regex]::Escape($version))
            if (-not $valid) { throw "Release tag does not match pyproject.toml" }
          }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is stale" }
          uv sync --frozen --prerelease allow --extra desktop --extra desktop-build --extra test
          if ($LASTEXITCODE -ne 0) { throw "Locked desktop dependency installation failed" }
      - name: Test desktop and dataset workflows
        shell: powershell
        env:
          LANGSMITH_TRACING: "false"
        run: |
          uv run --no-sync python -m pytest tests/test_desktop.py tests/test_jobs.py tests/test_soccer.py tests/test_optional_dependencies.py -ra
          if ($LASTEXITCODE -ne 0) { throw "Desktop regression tests failed" }
      - name: Validate and build frontend
        shell: powershell
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Frontend dependency installation failed" }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Frontend type checks failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed" }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Import optional signing certificate
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "No signing certificate configured; producing an unsigned installer."
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP "open-sports-analyst.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "WINDOWS_SIGNING_PFX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: powershell
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $parameters = @{ SkipFrontend = $true; SkipSmokeTest = $true }
          if ($env:BUILD_REF_TYPE -eq "tag") { $parameters.Version = $env:BUILD_REF_NAME.Substring(1) }
          if (-not $env:WINDOWS_SIGNING_PFX_PATH) { $parameters.SkipSigning = $true }
          ./packaging/windows/build.ps1 @parameters
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSportsAnalyst-windows-diagnostics
          path: |
            build/desktop/OpenSportsAnalyst/warn-OpenSportsAnalyst.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Create installer checksum
        shell: powershell
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist/installer -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer." }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSportsAnalyst-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
      - name: Remove temporary signing certificate
        if: always()
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "open-sports-analyst.pfx"
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $installer = Get-ChildItem -LiteralPath dist/installer -Filter "*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "The Windows installer was not found." }
          $checksum = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum)) { throw "The installer checksum was not found." }

          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag $installer.FullName $checksum --clobber
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release asset upload failed." }
            exit 0
          }

          $releaseTitle = "Open Sports Analyst $tag"
          if ($tag -eq "v1.0.0") { $releaseTitle = "Open Sports Analyst v1.0.0 - Windows Desktop Release" }
          $arguments = @(
            "release", "create", $tag,
            $installer.FullName, $checksum,
            "--verify-tag",
            "--title", $releaseTitle,
            "--generate-notes"
          )
          if ($tag -match "(?i)-(alpha|beta|rc)(?:[.-]|$)") { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed." }
